# fbweb-ls: nghe tin Fanpage thẳng trên socket Lightspeed, thay cho fbweb-browser.
# Dùng chung .env với ../bridge-web/browser (FBWEB_TOKEN, FBWEB_ACCOUNT, FBWEB_PAGE_ID).
#   ./export-cookies.sh                    # lấy cookie phiên từ fbweb-browser vào ./data
#   docker compose run --rm ls check       # tải trang Hộp thư một lần, không mở socket
#   docker compose up -d --build           # chạy
name: fbweb-ls

services:
  ls:
    build:
      context: .
      additional_contexts:
        meta: ../../bridge-e2ee/meta
    image: fbweb-ls
    restart: unless-stopped
    read_only: true
    env_file:
      - path: ../bridge-web/browser/.env
        required: false
    environment:
      FBWEB_URL: ${FBWEB_URL:-http://host.docker.internal:7008}
      FBWEB_ACCOUNT: ${FBWEB_ACCOUNT:-vetgo}
      FBWEB_PAGE_ID: ${FBWEB_PAGE_ID:-109282408574091}
      # 1: chỉ ghi log loại/mid của sự kiện, không gửi fb-bridge-web, không heartbeat.
      FBLS_DRY_RUN: ${FBLS_DRY_RUN:-0}
      FBLS_DEBUG: ${FBLS_DEBUG:-0}
      GOMEMLIMIT: 40MiB
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # cookies.json và state.json (cursor); thư mục quyền 700, không commit.
      - ./data:/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64m }
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }
